<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ownership workbench · CodeTransport</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; gap: 14px;
         padding: clamp(12px, 3vw, 40px); background: #f6f7f2; color: #243848;
         font-family: "IBM Plex Mono", ui-monospace, monospace; }
  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 24px; }
  h1 { font-family: "Instrument Sans", system-ui, sans-serif; font-weight: 600;
       letter-spacing: -.04em; font-size: clamp(22px, 4vw, 38px); margin: 0; }
  p { color: #465f63; font-size: 13px; margin: 0; }
  main { min-height: 1px; flex: 1; border: 1px solid #b8c8c5; }
  canvas { display: block; width: 100%; height: 100%; background: #fff;
           touch-action: none; outline-offset: 3px; }
</style>
<header>
  <h1>Ownership workbench</h1>
  <p id="controls">Click a node to inspect it. Drag or use arrow keys to pan. Scroll to zoom.</p>
</header>
<main><canvas tabindex="0" aria-label="Interactive ownership tree and dependency diagram" aria-describedby="controls">
  The workbench requires a browser with Canvas support.
</canvas></main>
<script src="dist/agda-bundle.js"></script>
<script src="web-relay.js"></script>
</html>
